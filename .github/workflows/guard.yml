name: guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identity hygiene
        run: node scripts/check-identity.mjs
        env:
          GIT_AUTHOR_NAME: guard
          GIT_AUTHOR_EMAIL: noreply@github.com
          GIT_COMMITTER_NAME: guard
          GIT_COMMITTER_EMAIL: noreply@github.com
      - name: Kit validation
        run: node scripts/validate-skill-kit.mjs
      - name: Public documentation pairs
        run: node scripts/check-public-docs.mjs
      - name: Tests
        run: node --test "scripts/__tests__/**/*.test.mjs"
      - name: Release dry-run
        run: node scripts/pack-release.mjs --dry-run
